<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Call (ID Based)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simple Video Call - ID Based</h1>

    <!-- Main container for video elements -->
    <div class="video-container">
        <!-- Local video display section -->
        <div>
            <h2>Local Video</h2>
            <!-- The 'video' tag is used to embed video content.
                 'id="localVideo"' identifies this element for JavaScript control.
                 'autoplay' attribute ensures the video starts playing as soon as it's ready.
                 'playsinline' attribute is important for video playback directly in the layout on mobile browsers (iOS).
                 'muted' attribute mutes the local video to prevent audio feedback loops during testing. -->
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <!-- Remote video display section -->
        <div>
            <h2>Remote Video</h2>
            <!-- The 'video' tag for the remote peer's video.
                 'id="remoteVideo"' identifies this element for JavaScript control.
                 'autoplay' and 'playsinline' serve the same purpose as for the local video.
                 It is not muted by default, as we want to hear the remote peer. -->
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <!-- Call Controls and Status: This section replaces the manual signaling UI.
         It provides controls for creating a call (getting a Call ID), joining a call (using a Call ID),
         hanging up, and displays the current status of the call process. -->
    <div class="call-controls">
        <h2>Controls</h2>
        <!-- Group for creating a new call session -->
        <div class="control-group">
            <!-- Button to trigger the creation of a new call session.
                 When clicked, JavaScript will contact the signaling server to get a unique Call ID. -->
            <button id="createCallButton">1. Create New Call & Get ID</button>
            <!-- Paragraph element where the unique Call ID (session ID) generated by the server will be displayed.
                 The user who creates the call shares this ID with the other peer. -->
            <p id="callIdDisplay" class="call-id-display">Your Call ID will appear here.</p>
        </div>
        <hr class="control-divider"> <!-- Visual separator -->
        <!-- Group for joining an existing call session -->
        <div class="control-group">
            <!-- Text input field for the user to paste or type the Call ID they received from the call initiator. -->
            <input type="text" id="sessionIdInput" placeholder="Enter Call ID to Join">
            <!-- Button to trigger joining a call session using the ID entered in 'sessionIdInput'.
                 JavaScript will use this ID to inform the signaling server. -->
            <button id="joinCallButton">2. Join Call with ID</button>
        </div>
        <hr class="control-divider"> <!-- Visual separator -->
        <!-- Group for the hang-up button -->
        <div class="control-group">
            <!-- Button to end the current active call.
                 It's initially disabled and enabled once a call is established or in progress. -->
            <button id="hangupButton" disabled>Hang Up</button>
        </div>
        <!-- Paragraph element to display various status messages to the user throughout the call lifecycle
             (e.g., "Connecting...", "Waiting for peer...", "Call connected", "Error..."). -->
        <p id="callStatus" class="call-status">Welcome! Create or join a call.</p>
    </div>

    <!-- Link to the external JavaScript file containing the WebRTC and WebSocket signaling logic. -->
    <script src="script.js"></script>
</body>
</html>
